<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>営業ツール</title>
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --line:#e3e1da; --line2:#cfccc3;
  --text:#24231f; --muted:#6d6b64; --accent:#2f6f5e; --accent-bg:#e4f1ec;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1b19; --card:#252522; --line:#3a3935; --line2:#4a4944; --text:#ecebe6; --muted:#a3a19a; --accent:#7fd0b5; --accent-bg:#1f3a32; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 "Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 16px}
h1{font-size:22px;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 24px;font-size:14px}
a.item{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-bottom:12px;color:inherit;text-decoration:none}
a.item:hover{border-color:var(--accent)}
a.item .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center}
a.item b{display:block;font-size:17px}
a.item span{display:block;font-size:13px;color:var(--muted)}
a.item .go{margin-left:auto;color:var(--muted);font-size:20px}
</style>
</head>
<body>
<main>
  <h1>営業ツール</h1>
  <p class="sub">有料老人ホームの営業記録</p>

  <a class="item" href="report.html">
    <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6M8 4H6a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-2"/><path d="M9 12h6M9 16h4"/></svg></span>
    <div><b>訪問報告</b><span>訪問・電話の記録、名刺の撮影</span></div>
    <span class="go">›</span>
  </a>

  <a class="item" href="cases.html">
    <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg></span>
    <div><b>成果の記録</b><span>問合せ・見学・入居の進み具合</span></div>
    <span class="go">›</span>
  </a>

  <a class="item" href="import.html">
    <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5"/><path d="M5 19h14"/></svg></span>
    <div><b>営業先の取り込み</b><span>Excel・CSV・PDFから一括登録（パソコン向け）</span></div>
    <span class="go">›</span>
  </a>
</main>
</body>
</html>
